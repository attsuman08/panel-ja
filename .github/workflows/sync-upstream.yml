# Fork-only workflow: merge calagopus/panel into main on a schedule,
# auto-resolve ja.json conflicts, and translate new strings with Claude.
#
# Required secrets:
#   SYNC_TOKEN               Fine-grained PAT for this repo with
#                            "Contents: Read and write" and "Workflows: Read and write".
#                            (GITHUB_TOKEN cannot push upstream changes to .github/workflows.)
#   CLAUDE_CODE_OAUTH_TOKEN  Output of `claude setup-token` (uses your Claude subscription), or
#   ANTHROPIC_API_KEY        an API key instead (pay-as-you-go). Only one is needed.
#                            Without either, the merge still runs and translation is skipped.
name: Sync upstream

on:
  schedule:
    - cron: '23 18 * * *' # 03:23 JST daily
  workflow_dispatch:
    inputs:
      translate:
        description: 'Translate missing ja.json keys with Claude'
        type: boolean
        default: true

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/calagopus/panel.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  JA_FILES: frontend/public/translations/ja.json shared/mails/variables/ja.json
  TODO_FILE: .ja-todo.json
  RESULT_FILE: .ja-result.json
  HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge upstream
        id: merge
        run: |
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          msg="Merge branch '$UPSTREAM_BRANCH' of $UPSTREAM_REPO"
          if ! git merge --no-ff --no-edit -m "$msg" "upstream/$UPSTREAM_BRANCH"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files:"; echo "$conflicts"

            others=$(echo "$conflicts" | grep -vxF $(printf -- '-e %s ' $JA_FILES) || true)
            if [ -n "$others" ]; then
              echo "::error::Conflicts outside ja.json need manual resolution:%0A${others//$'\n'/%0A}"
              git merge --abort
              exit 1
            fi

            python3 scripts/ja_sync.py resolve $conflicts
            git commit --no-edit
          fi

      - name: Find strings to translate
        id: todo
        run: |
          python3 scripts/ja_sync.py normalize
          count=$(python3 scripts/ja_sync.py todo --old-ref "${{ steps.merge.outputs.before }}" --output "$TODO_FILE")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count key(s) need translation."

      - name: Translate with Claude
        id: translate
        if: >-
          steps.todo.outputs.count != '0'
          && github.event.inputs.translate != 'false'
          && env.HAS_CLAUDE_AUTH == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Write,Grep,Glob"
          prompt: |
            You are translating the UI of a game-server management panel into Japanese.

            `${{ env.TODO_FILE }}` lists the strings that need work, grouped by target file:
            { "<ja.json path>": { "<dotted.key>": { "en": "...", "old_en"?: "...", "ja"?: "..." } } }
            - Entries with only "en" are missing and need a new translation.
            - Entries with "old_en" and "ja" had their English text changed upstream.
              Update the existing "ja" so it matches the new "en" (keep it if it already fits).

            Write ALL results to `${{ env.RESULT_FILE }}` as JSON in this exact shape:
            { "<ja.json path>": { "<dotted.key>": "日本語訳" } }

            Rules:
            - Keep every placeholder exactly as in English: `{count}`, `{name}`, `{{ settings.app.name }}`, etc.
              Keep HTML tags and Markdown intact.
            - Keys ending in .zero/.one/.two/.few/.many/.other are plural forms; Japanese normally
              uses the same text for all of them.
            - Match the terminology and tone of the existing translations. The ja.json files are
              large, so do NOT read them in full: use Grep on them to look up how related words
              and nearby keys (same key prefix) are already translated.
            - Do not edit any file other than `${{ env.RESULT_FILE }}`. Do not commit.

      - name: Apply translations
        if: steps.translate.outcome == 'success'
        run: |
          if [ ! -f "$RESULT_FILE" ]; then
            echo "::warning::Claude did not produce $RESULT_FILE"
            exit 0
          fi
          python3 scripts/ja_sync.py apply "$RESULT_FILE"
          python3 scripts/ja_sync.py check > /tmp/check.log || true
          if grep -q '^PLACEHOLDER' /tmp/check.log; then
            grep '^PLACEHOLDER' /tmp/check.log
            echo "::error::Placeholder mismatch in Claude's translations; discarding them."
            git checkout -- $JA_FILES
            python3 scripts/ja_sync.py normalize
            exit 1
          fi

      - name: Commit and push
        if: always() && steps.merge.outcome == 'success'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          rm -f "$TODO_FILE" "$RESULT_FILE"
          git add -- $JA_FILES
          if ! git diff --cached --quiet; then
            git commit -m "update japanese translations"
          fi

          if [ "$(git rev-parse HEAD)" = "${{ steps.merge.outputs.before }}" ]; then
            echo "Nothing to push."
            exit 0
          fi
          git log --oneline "${{ steps.merge.outputs.before }}..HEAD" --first-parent
          # Push with the PAT explicitly, in case another step replaced the git credentials.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$TARGET_BRANCH"

      - name: Report untranslated keys
        if: always() && steps.merge.outcome == 'success'
        run: |
          python3 scripts/find_missing_ja_keys.py --missing-only --keys-only >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
