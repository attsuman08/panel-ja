name: Release Latest

# Fork-only release build, kept in line with upstream's build-and-publish.yml
# minus the AIO variants, Docker Hub and Windows. main tracks the latest
# upstream release tag, so every push to main is published with the stable
# tags, using upstream's names: "latest" and "heavy".

on:
  push:
    branches:
      - main

env:
  BIN_NAME: panel-rs
  PROJECT_NAME: panel-rs
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_TAG: latest
  HEAVY_TAG: heavy

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
          run_install: false

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build frontend
        run: |
          cd frontend
          pnpm build:ci

      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: frontend/dist/

  dist-linux:
    name: Dist (${{ matrix.build }})
    needs: [build-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build: [x86_64-linux, aarch64-linux, riscv64-linux, ppc64le-linux]
        include:
          - build: x86_64-linux
            target: x86_64-unknown-linux-musl
          - build: aarch64-linux
            target: aarch64-unknown-linux-musl
          - build: riscv64-linux
            target: riscv64gc-unknown-linux-musl
          - build: ppc64le-linux
            target: powerpc64le-unknown-linux-musl

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ env.BIN_NAME }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross
        env:
          CARGO_BUILD_WARNINGS: allow
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked

      - name: Build release binary
        env:
          # riscv64gc musl is not crt-static by default
          # opt-level=z enables LLVM's MachineOutliner on aarch64/riscv64; its whole-module
          # suffix tree under fat LTO + codegen-units=1 OOMs the 16GB runner.
          RUSTFLAGS: "-C target-feature=+crt-static -C llvm-args=-enable-machine-outliner=never"
        run: cross build --release --target ${{ matrix.target }} -p $BIN_NAME

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/$BIN_NAME-${{ matrix.build }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.build }}
          path: dist/*

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cyclonedx.json
          artifact-name: sbom-source.cyclonedx.json
          upload-artifact: true

  create-multiarch-images:
    name: Create multi-arch Docker image
    needs: [dist-linux, generate-sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download source SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-source.cyclonedx.json
          path: sbom

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.PROJECT_NAME }}-*-linux
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare binaries
        run: |
          for pair in x86_64:amd64 aarch64:arm64 riscv64:riscv64 ppc64le:ppc64le; do
            build="${pair%%:*}-linux"
            arch="${pair#*:}"
            mkdir -p ".docker/$arch"
            cp "dist/$BIN_NAME-$build/$BIN_NAME-$build" ".docker/$arch/$BIN_NAME"
          done

          chmod +x .docker/*/*

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          sbom: true
          provenance: true

      - name: Attach source SBOM attestation to image (GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/sbom-source.cyclonedx.json
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign
        run: |
          cosign sign --yes --recursive ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

  build-heavy-images:
    name: Build heavy Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile.heavy
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ env.HEAVY_TAG }}-${{ matrix.arch }}
          sbom: scan-stages=true
          provenance: true
          cache-from: type=gha,scope=heavy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=heavy-${{ matrix.arch }}

  merge-heavy-images:
    name: Merge heavy Docker manifest
    needs: [build-heavy-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Create, push and sign multi-arch manifest
        run: |
          docker buildx imagetools create -t "$GHCR_IMAGE:$HEAVY_TAG" \
            "$GHCR_IMAGE:$HEAVY_TAG-amd64" \
            "$GHCR_IMAGE:$HEAVY_TAG-arm64"
          cosign sign --yes --recursive "$GHCR_IMAGE:$HEAVY_TAG"
